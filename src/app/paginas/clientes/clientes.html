
<!-- seção principal da página de cadastro de clientes -->
<section class="clientes">

  <!-- título e descrição da página -->
  <div class="titulo-clientes">
    <span>Purple Bomb</span>
    <h2>Cadastro de clientes</h2>
  </div>

  <!-- formulário responsável por cadastrar um cliente -->
  <!-- cria uma referência ao formulário para verificar sua validade -->
  <!-- chama o método de cadastro quando o formulário é enviado -->
  <form
  class="formulario-clientes"
  #formCliente="ngForm"
  (ngSubmit)="cadastrarCliente(formCliente)"
>

    <!-- campo para informar o nome completo -->
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input
        type="text"
        id="nome"
        name="nome"
        [(ngModel)]="cliente.nome"
        placeholder="Digite o nome completo"
        required
      />
    </div>

    <!-- campo para informar o CPF com 11 números -->
    <div class="campo">
      <label for="cpf">CPF</label>
      <input
        type="text"
        id="cpf"
        name="cpf"
        [(ngModel)]="cliente.cpf"
        placeholder="Digite o CPF"
        required
        maxlength="11"
        pattern="[0-9]{11}"
      />
    </div>

    <!-- campo para selecionar a data de nascimento -->
    <div class="campo">
      <label for="dataNascimento">Data de nascimento</label>
      <input
        type="date"
        id="dataNascimento"
        name="dataNascimento"
        [(ngModel)]="cliente.dataNascimento"
        required
      />
    </div>

    <!-- campo para selecionar o sexo -->
    <div class="campo">
      <label for="sexo">Sexo</label>
      <select
        id="sexo"
        name="sexo"
        [(ngModel)]="cliente.sexo"
        required
      >
        <option value="">Selecione</option>
        <option value="F">Feminino</option>
        <option value="M">Masculino</option>
        <option value="O">Outro</option>
      </select>
    </div>

    <!-- campo para informar o e-mail -->
    <div class="campo">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="cliente.email"
        placeholder="Digite o e-mail"
        required
      />
    </div>

    <!-- campo para informar o telefone com DDD -->
    <div class="campo">
      <label for="telefone">Telefone</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        [(ngModel)]="cliente.telefone"
        placeholder="Somente números"
        required
        maxlength="11"
        pattern="[0-9]{10,11}"
      />
    </div>

    <!-- campo para informar o CEP do endereço -->
    <div class="campo">
      <label for="cep">CEP</label>
      <input
        type="text"
        id="cep"
        name="cep"
        [(ngModel)]="cliente.cep"
        placeholder="Digite o CEP"
        required
        maxlength="8"
        pattern="[0-9]{8}"
      />
    </div>

    <!-- campo para informar o número do endereço -->
    <div class="campo">
      <label for="numero">Número do endereço</label>
      <input
        type="text"
        id="numero"
        name="numero"
        [(ngModel)]="cliente.numero"
        placeholder="Número"
        required
      />
    </div>

    <!-- campo opcional para complemento do endereço -->
    <div class="campo">
      <label for="complemento">Complemento</label>
      <input
        type="text"
        id="complemento"
        name="complemento"
        [(ngModel)]="cliente.complemento"
        placeholder="Casa, apartamento etc."
      />
    </div>

    <!-- exibe mensagens de sucesso ou erro do cadastro -->
    <p *ngIf="mensagem" role="status">{{ mensagem }}</p>

    <!-- envia os dados e desabilita o botão durante o cadastro -->
    <button
      type="submit"
      [disabled]="formCliente.invalid || carregando"
    >
      {{ carregando ? 'Cadastrando...' : 'Cadastrar cliente' }}
    </button>

    <!-- limpa os campos preenchidos no formulário -->
    <button
      type="button"
      (click)="limparFormulario(formCliente)"
    >
      Limpar
    </button>

    <!-- retorna à página inicial da loja -->
    <button
      type="button"
      (click)="voltarCatalogo()"
    >
      Voltar ao catálogo
    </button>

  </form>
</section>
